  $('ck').innerHTML='<div style="display:flex;align-items:center;gap:1.4vw"><div id="cd">'+days+'</div><div id="cap">'+(h24?'':ap)+'</div></div><div id="cm">'+big+'</div><div id="cr2"><div class="rw">'+dg(+sc.charAt(0),1)+dg(+sc.charAt(1),1)+'<span class="lb">SEC</span></div><div class="rw">'+dg(+mo.charAt(0),1)+dg(+mo.charAt(1),1)+'<div class="dt"></div>'+dg(+da.charAt(0),1)+dg(+da.charAt(1),1)+'</div></div>';
  $('hint').textContent='OK: change colour  |  Left / Right: 12 or 24 hour  |  Back: return';
}
setInterval(clockDraw,1000);
applyGlass();applyWp();load();
</script></body></html>
